<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Golfista 2D — HomeGolfLab</title>
</head>
<body>
<canvas id="stage"></canvas>
<script src="/_hgl/player.js"></script>
<script type="module">
import { VARIANT_LABELS, duration, pose, toPx, W, H } from './golfer-rig.js';

const C = { sky1: '#BFE3F2', sky2: '#EAF6FB', hill: '#9BC59D', hill2: '#7FB085', g1: '#93C47F', g2: '#5E9E52', skin: '#E0A982', shirt: '#1F3552', shorts: '#8A9099', shoe: '#FFFFFF', cap: '#9AA0A6', club: '#3B4045', gold: '#E8C04A' };
const PX = 441; // píxeles por metro

function draw(ctx, t, w, h, ui) {
  const j = pose(t, ui.variante);
  const P = (v) => toPx(v);

  // fondo
  let g = ctx.createLinearGradient(0, 0, 0, h * 0.62);
  g.addColorStop(0, C.sky1); g.addColorStop(1, C.sky2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = C.hill2; ctx.beginPath(); ctx.ellipse(w * 0.15, h * 0.62, w * 0.7, h * 0.07, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = C.hill; ctx.beginPath(); ctx.ellipse(w * 0.85, h * 0.62, w * 0.65, h * 0.05, 0, Math.PI, 0); ctx.fill();
  g = ctx.createLinearGradient(0, h * 0.62, 0, h);
  g.addColorStop(0, C.g1); g.addColorStop(1, C.g2);
  ctx.fillStyle = g; ctx.fillRect(0, h * 0.62, w, h * 0.38);
  ctx.fillStyle = 'rgba(255,255,255,.06)';
  for (let i = 0; i < 7; i++) ctx.fillRect(0, h * 0.64 + i * 62, w, 28);

  // sombra
  const feet = P([0, 0, 0]);
  ctx.fillStyle = 'rgba(14,27,20,.18)';
  ctx.beginPath(); ctx.ellipse(feet[0] + 18, feet[1] + 6, 150, 20, 0, 0, Math.PI * 2); ctx.fill();

  // bola
  const b = P(j.ball), br = Math.max(4, 11 - Math.max(0, j.ball[2] - 0.55) * 4);
  if (b[0] < w + 40 && b[1] > -40) { ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(b[0], b[1], br, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }

  const L = HGL.limb;
  // piernas
  const hl = P(j.HL), hr = P(j.HR), kl = P(j.kneeL), kr = P(j.kneeR), al = P(j.ankleL), ar = P(j.ankleR);
  for (const [hp, kp, ap] of [[hr, kr, ar], [hl, kl, al]]) {
    L(ctx, hp, kp, 52, C.shorts);
    L(ctx, kp, ap, 34, C.skin);
    ctx.fillStyle = C.shoe; ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(ap[0] + (ap === al ? 8 : -8), ap[1] + 10, 34, 15, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  // torso
  const sl = P(j.SL), sr = P(j.SR);
  ctx.fillStyle = C.shirt; ctx.beginPath();
  ctx.moveTo(sr[0] - 14, sr[1] - 4); ctx.lineTo(sl[0] + 14, sl[1] - 4); ctx.lineTo(hl[0] + 18, hl[1]); ctx.lineTo(hr[0] - 18, hr[1]); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.shorts; ctx.beginPath();
  ctx.moveTo(hr[0] - 24, hr[1] - 12); ctx.lineTo(hl[0] + 24, hl[1] - 12); ctx.lineTo(hl[0] + 28, hl[1] + 38); ctx.lineTo(hr[0] - 28, hr[1] + 38); ctx.closePath(); ctx.fill();
  // cuello y cabeza
  const sm = [(sl[0] + sr[0]) / 2, (sl[1] + sr[1]) / 2], hd = P(j.nose);
  L(ctx, sm, [hd[0], hd[1] + 40], 30, C.skin);
  const hc = [hd[0], hd[1] - 8];
  ctx.fillStyle = C.skin; ctx.beginPath(); ctx.ellipse(hc[0], hc[1], 40, 48, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.cap; ctx.beginPath(); ctx.ellipse(hc[0], hc[1] - 14, 43, 36, 0, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.ellipse(hc[0], hc[1] - 14, 52, 9, 0, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#2a2a2a'; for (const dx of [-15, 15]) { ctx.beginPath(); ctx.arc(hc[0] + dx, hc[1] + 2, 3.5, 0, Math.PI * 2); ctx.fill(); }
  // brazos
  const el = P(j.elbowL), er = P(j.elbowR), wl = P(j.wristL), wr = P(j.wristR);
  for (const [s, e, wv] of [[sr, er, wr], [sl, el, wl]]) {
    L(ctx, e, wv, 28, C.skin);
    L(ctx, s, e, 40, C.shirt);
  }
  // palo
  const hands = P(j.hands), head = P(j.clubHead);
  L(ctx, hands, head, 6, C.club);
  const ang = Math.atan2(head[1] - hands[1], head[0] - hands[0]);
  ctx.save(); ctx.translate(head[0], head[1]); ctx.rotate(ang);
  ctx.fillStyle = '#C9CED3'; HGL.roundRect(ctx, -4, -9, 40, 18, 6); ctx.fill(); ctx.restore();
  ctx.fillStyle = C.skin; ctx.beginPath(); ctx.arc(hands[0], hands[1], 17, 0, Math.PI * 2); ctx.fill();

  if (!HGL.rendering) {
    ctx.fillStyle = 'rgba(14,27,20,.72)'; HGL.roundRect(ctx, 24, 24, w - 48, 64, 16); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '600 30px Inter, Segoe UI, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(VARIANT_LABELS[ui.variante], w / 2, 66); ctx.textAlign = 'left';
  }
}

const opts = Object.fromEntries(Object.entries(VARIANT_LABELS));
HGL.scene({
  width: W, height: H, fps: 30,
  duration: duration(new URLSearchParams(location.search).get('variante') || 'bueno'),
  controls: [{ id: 'variante', label: 'Swing', options: opts }],
  draw,
});
</script>
</body>
</html>
