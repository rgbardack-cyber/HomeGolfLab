# Publica la app como sitio estático en GitHub Pages.
#
# Pasos que solo puede hacer el dueño del repositorio (una vez):
#  1. Settings > Pages > Source: "GitHub Actions". En un repositorio privado, Pages exige un plan de pago;
#     si la cuenta no lo tiene, la alternativa es otro hosting estático con HTTPS (Cloudflare Pages, Netlify, Vercel).
#  2. Settings > Environments > github-pages: permitir la rama desde la que se publica (o publicar desde main).
#  3. Actions > "Publicar en GitHub Pages" > Run workflow, y elegir la rama.
# La dirección queda en https://<usuario>.github.io/HomeGolfLab/ y es pública aunque el repositorio sea privado.
name: Publicar en GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [release/v1]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homegolflab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: homegolflab/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # Versión pública (R2, 23 nov 2026): sin VITE_INTERNAL ni VITE_FLAG_*, todas las banderas quedan apagadas.
          # Para una demostración, agregarlas de nuevo en una rama aparte, nunca en la que publica.
      # Pages sirve 404.html en rutas desconocidas: así un enlace directo (/HomeGolfLab/swing) carga la app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: homegolflab/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
