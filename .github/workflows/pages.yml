# Publica la app como sitio estático en GitHub Pages.
#
# Pasos que solo puede hacer el dueño del repositorio (una vez):
#  1. Settings > Pages > Source: "GitHub Actions". En un repositorio privado, Pages exige un plan de pago;
#     si la cuenta no lo tiene, la alternativa es otro hosting estático con HTTPS (Cloudflare Pages, Netlify, Vercel).
#  2. Settings > Environments > github-pages: permitir la rama desde la que se publica (o publicar desde main).
#  3. Actions > "Publicar en GitHub Pages" > Run workflow, y elegir la rama.
# La dirección queda en https://<usuario>.github.io/HomeGolfLab/ y es pública aunque el repositorio sea privado.
name: Publicar en GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main, feat/video-review-export]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homegolflab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: homegolflab/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # VERSIÓN DE PRUEBA para demostraciones (20 nov 2026): panel de funciones de prueba visible y encendido lo que ya se verificó.
          # Siguen apagadas: flightEstimate, shotShapeAuto y distanceEstimate (sin validar). Para una versión pública, quitar estas líneas.
          VITE_INTERNAL: '1'
          VITE_FLAG_VIDEO_REVIEW: '1'
          VITE_FLAG_COMPARE: '1'
          VITE_FLAG_FLIGHT_V2: '1'
          VITE_FLAG_EXPORT: '1'
          VITE_FLAG_EXPORT_GATE: '1'
          VITE_FLAG_LIVE_RECORDING: '1'
      # Pages sirve 404.html en rutas desconocidas: así un enlace directo (/HomeGolfLab/swing) carga la app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: homegolflab/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
